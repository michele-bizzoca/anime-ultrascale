[build-system]
requires      = ["setuptools >= 61"]
build-backend = "setuptools.build_meta"

[project]
name            = "anime-ultrascale"
version         = "1.0"
description     = "A tool for extreme anime upscaling."
requires-python = ">= 3.12"

dependencies = [ "pyvips       >= 3.0.0"  ,
                 "psutil       >= 5.9.0"  ,
                 "dacite       >= 1.8.1"  ,
                 "numpy        >= 1.21.3" ,
                 "scikit-image >= 0.19.3" ,
                 "pyssim       >= 0.7.1" ,
                 "wcwidth      >= 0.2.13" ]

[tool.setuptools]
py-modules = ["anime-ultrascale"]
packages = []
