[build-system]
requires      = ["setuptools >= 61"]
build-backend = "setuptools.build_meta"

[project]
name            = "anime-ultrascale"
version         = "1.0"
description     = "A workflow for extreme anime upscaling."
requires-python = ">= 3.10"

dependencies = [ "Pillow >= 10.0.0" ,
                 "pyvips >=  3.0.0" ,
                 "psutil >=  5.9.0" ,
                 "dacite >=  1.8.1" ]

[tool.setuptools]
py-modules = ["anime-ultrascale"]
packages = []
